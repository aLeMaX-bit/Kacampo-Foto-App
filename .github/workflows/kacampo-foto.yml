name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Buat proyek
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KacampoFoto"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fastmerge"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kacampo.foto"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              signingConfigs {
                  create("fm") {
                      storeFile = file("../fm.keystore")
                      storePassword = "fastmerge"
                      keyAlias = "fm"
                      keyPassword = "fastmerge"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                      // kunci tetap, supaya update APK bisa dipasang di atas versi lama
                      signingConfig = signingConfigs.getByName("fm")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.exifinterface:exifinterface:1.3.7")
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Sengaja TANPA permission INTERNET: aplikasi 100% offline dan tanpa iklan -->
              <application
                  android:allowBackup="false"
                  android:label="Kacampo Foto"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/fastmerge
          cat > app/src/main/java/com/fastmerge/MainActivity.kt <<'EOF_5'
          package com.fastmerge

          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.PickVisualMediaRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.exifinterface.media.ExifInterface
          import androidx.recyclerview.widget.ItemTouchHelper
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.util.concurrent.Executors
          import kotlin.math.ceil
          import kotlin.math.max
          import kotlin.math.min

          private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          private const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
          private const val MAX_PIXELS = 36_000_000L   // batas aman memori (hasil akhir)
          private const val MAX_SIDE = 16000
          private const val MAX_BASE = 2000f           // lebar/tinggi dasar maksimal hasil akhir
          private const val BLUE = 0xFF2962FF.toInt()
          private const val NAVY = 0xFF1F3A93.toInt()
          private const val SOFT = 0xFFE3E8F7.toInt()

          class MainActivity : ComponentActivity() {

              private class Info(val uri: Uri, val w: Int, val h: Int, val rot: Int)
              private class VH(val row: LinearLayout, val img: ImageView, val num: TextView, val del: TextView) :
                  RecyclerView.ViewHolder(row)

              private val uris = ArrayList<Uri>()
              private val thumbs = android.util.LruCache<Uri, Bitmap>(80)
              private val cores = Runtime.getRuntime().availableProcessors().coerceIn(2, 4)
              private val pool = Executors.newFixedThreadPool(cores)
              private val thumbPool = Executors.newFixedThreadPool(2)
              private val work = Executors.newSingleThreadExecutor()

              // Pengaturan (default: horizontal)
              private var horizontal = true
              private var bg = Color.WHITE
              private var frameP = 0
              private var gapP = 0
              private var radP = 0

              private var lastSaved: Uri? = null
              private var previewToken = 0
              private var previewBmp: Bitmap? = null

              private val colorValues = intArrayOf(
                  Color.WHITE, Color.BLACK, 0xFF2962FF.toInt(),
                  0xFFE53935.toInt(), 0xFF43A047.toInt(), 0xFFFFB300.toInt()
              )
              private val colorViews = ArrayList<View>()

              private lateinit var mainView: View
              private lateinit var previewView: View
              private lateinit var list: RecyclerView
              private lateinit var empty: TextView
              private lateinit var countText: TextView
              private lateinit var previewBtn: Button
              private lateinit var segH: Button
              private lateinit var segV: Button
              private lateinit var previewImg: ImageView
              private lateinit var previewMsg: TextView
              private lateinit var saveBtn: Button
              private lateinit var saveStatus: TextView
              private lateinit var backCb: OnBackPressedCallback

              private val picker =
                  registerForActivityResult(ActivityResultContracts.PickMultipleVisualMedia()) { r ->
                      if (r.isNotEmpty()) {
                          uris.addAll(r)
                          list.adapter?.notifyDataSetChanged()
                          refresh()
                      }
                  }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val container = FrameLayout(this)
                  mainView = buildMain()
                  previewView = buildPreview()
                  previewView.visibility = View.GONE
                  container.addView(mainView, MATCH, MATCH)
                  container.addView(previewView, MATCH, MATCH)
                  setContentView(container)

                  backCb = object : OnBackPressedCallback(false) {
                      override fun handleOnBackPressed() { closePreview() }
                  }
                  onBackPressedDispatcher.addCallback(this, backCb)

                  paintSeg()
                  paintColors()
                  refresh()
              }

              // ---------- Tampilan utama (semua tombol di bawah, mudah dijangkau jempol) ----------
              private fun buildMain(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F1F3F8"))
                  }

                  // Judul (hanya informasi, tidak ada tombol di atas)
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(8))
                  }
                  header.addView(TextView(this).apply {
                      text = "Kacampo Foto"
                      textSize = 22f
                      setTextColor(NAVY)
                  }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  countText = TextView(this).apply { textSize = 14f; setTextColor(Color.GRAY) }
                  header.addView(countText)
                  root.addView(header)

                  // Daftar gambar
                  val frame = FrameLayout(this)
                  list = RecyclerView(this).apply {
                      layoutManager = LinearLayoutManager(this@MainActivity)
                      adapter = Adapter()
                      setHasFixedSize(true)
                      clipToPadding = false
                      setPadding(dp(12), 0, dp(12), dp(8))
                  }
                  empty = TextView(this).apply {
                      text = "＋\n\nKetuk di sini untuk tambah gambar\n\nTahan lama lalu geser\nuntuk atur urutan"
                      gravity = Gravity.CENTER
                      textSize = 16f
                      setTextColor(Color.GRAY)
                      setOnClickListener { pick() }
                  }
                  frame.addView(list, MATCH, MATCH)
                  frame.addView(empty, MATCH, MATCH)
                  root.addView(frame, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  ItemTouchHelper(object : ItemTouchHelper.SimpleCallback(
                      ItemTouchHelper.UP or ItemTouchHelper.DOWN, 0
                  ) {
                      override fun onMove(
                          rv: RecyclerView, a: RecyclerView.ViewHolder, b: RecyclerView.ViewHolder
                      ): Boolean {
                          val f = a.bindingAdapterPosition
                          val t = b.bindingAdapterPosition
                          if (f < 0 || t < 0) return false
                          uris.add(t, uris.removeAt(f))
                          rv.adapter?.notifyItemMoved(f, t)
                          return true
                      }

                      override fun onSwiped(vh: RecyclerView.ViewHolder, d: Int) {}

                      override fun clearView(rv: RecyclerView, vh: RecyclerView.ViewHolder) {
                          super.clearView(rv, vh)
                          rv.post { rv.adapter?.notifyDataSetChanged() }
                      }
                  }).attachToRecyclerView(list)

                  // Panel bawah (zona jempol)
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(14), dp(16), dp(18))
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          val r = dp(24).toFloat()
                          cornerRadii = floatArrayOf(r, r, r, r, 0f, 0f, 0f, 0f)
                      }
                      elevation = dp(8).toFloat()
                  }

                  val seg = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  segH = Button(this).apply {
                      text = "Horizontal"; isAllCaps = false; stateListAnimator = null
                      setOnClickListener { horizontal = true; paintSeg() }
                  }
                  segV = Button(this).apply {
                      text = "Vertikal"; isAllCaps = false; stateListAnimator = null
                      setOnClickListener { horizontal = false; paintSeg() }
                  }
                  seg.addView(segH, LinearLayout.LayoutParams(0, dp(48), 1f).apply { rightMargin = dp(8) })
                  seg.addView(segV, LinearLayout.LayoutParams(0, dp(48), 1f))
                  panel.addView(seg)

                  panel.addView(seekRow("Bingkai") { frameP = it })
                  panel.addView(seekRow("Spasi") { gapP = it })
                  panel.addView(seekRow("Radius") { radP = it })

                  val colorRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(6), 0, dp(14))
                  }
                  colorRow.addView(TextView(this).apply { text = "Latar"; textSize = 15f },
                      LinearLayout.LayoutParams(dp(72), WRAP))
                  colorValues.forEach { c ->
                      val v = View(this)
                      v.setOnClickListener { bg = c; paintColors() }
                      colorViews.add(v)
                      colorRow.addView(v, LinearLayout.LayoutParams(dp(34), dp(34)).apply { rightMargin = dp(8) })
                  }
                  panel.addView(colorRow)

                  val actions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val addBtn = action("+ Tambah", false) { pick() }
                  val clearBtn = action("Bersihkan", false) {
                      uris.clear(); list.adapter?.notifyDataSetChanged(); refresh()
                  }
                  previewBtn = action("Pratinjau ▶", true) { showPreview() }
                  actions.addView(addBtn, LinearLayout.LayoutParams(0, dp(56), 1f).apply { rightMargin = dp(8) })
                  actions.addView(clearBtn, LinearLayout.LayoutParams(0, dp(56), 1f).apply { rightMargin = dp(8) })
                  actions.addView(previewBtn, LinearLayout.LayoutParams(0, dp(56), 1.5f))
                  panel.addView(actions)

                  root.addView(panel, LinearLayout.LayoutParams(MATCH, WRAP))
                  return root
              }

              // ---------- Halaman pratinjau ----------
              private fun buildPreview(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF101218.toInt())
                  }
                  root.addView(TextView(this).apply {
                      text = "Pratinjau"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setPadding(dp(20), dp(24), dp(20), dp(8))
                  })

                  val fr = FrameLayout(this)
                  previewImg = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }
                  previewMsg = TextView(this).apply {
                      text = "Membuat pratinjau…"
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                  }
                  fr.addView(previewImg, MATCH, MATCH)
                  fr.addView(previewMsg, MATCH, MATCH)
                  root.addView(fr, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  saveStatus = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                      setPadding(dp(16), dp(8), dp(16), dp(8))
                      setOnClickListener {
                          lastSaved?.let {
                              startActivity(Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(it, "image/jpeg")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              })
                          }
                      }
                  }
                  root.addView(saveStatus)

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(16), dp(8), dp(16), dp(20))
                  }
                  val back = action("◀ Ubah", false) { closePreview() }
                  saveBtn = action("SIMPAN", true) { doSave() }
                  bar.addView(back, LinearLayout.LayoutParams(0, dp(60), 1f).apply { rightMargin = dp(8) })
                  bar.addView(saveBtn, LinearLayout.LayoutParams(0, dp(60), 1.6f))
                  root.addView(bar)
                  return root
              }

              private fun showPreview() {
                  if (uris.size < 2) {
                      Toast.makeText(this, "Pilih minimal 2 gambar", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val token = ++previewToken
                  mainView.visibility = View.GONE
                  previewView.visibility = View.VISIBLE
                  backCb.isEnabled = true
                  previewImg.setImageDrawable(null)
                  previewBmp?.recycle()
                  previewBmp = null
                  previewMsg.text = "Membuat pratinjau…"
                  previewMsg.visibility = View.VISIBLE
                  saveStatus.text = ""
                  saveBtn.text = "SIMPAN"
                  setEnabled(saveBtn, false)

                  work.execute {
                      try {
                          val bm = mergeBitmap(1000f, 6_000_000L, 4096)
                          runOnUiThread {
                              if (token == previewToken && previewView.visibility == View.VISIBLE) {
                                  previewBmp = bm
                                  previewImg.setImageBitmap(bm)
                                  previewMsg.visibility = View.GONE
                                  setEnabled(saveBtn, true)
                              } else {
                                  bm.recycle()
                              }
                          }
                      } catch (e: Throwable) {
                          runOnUiThread {
                              if (token == previewToken) {
                                  previewMsg.text = "Gagal: ${e.message ?: e.javaClass.simpleName}"
                              }
                          }
                      }
                  }
              }

              private fun closePreview() {
                  previewToken++
                  previewImg.setImageDrawable(null)
                  previewBmp?.recycle()
                  previewBmp = null
                  previewView.visibility = View.GONE
                  mainView.visibility = View.VISIBLE
                  backCb.isEnabled = false
              }

              private fun doSave() {
                  setEnabled(saveBtn, false)
                  saveStatus.text = "Menyimpan…"
                  work.execute {
                      val t0 = System.currentTimeMillis()
                      try {
                          val bm = mergeBitmap()
                          val u = saveBitmap(bm)
                          bm.recycle()
                          val ms = System.currentTimeMillis() - t0
                          runOnUiThread {
                              lastSaved = u
                              saveStatus.text = "✓ Tersimpan di Pictures/KacampoFoto (${ms} ms)\nKetuk di sini untuk melihat hasil"
                              saveBtn.text = "SIMPAN LAGI"
                              setEnabled(saveBtn, true)
                          }
                      } catch (e: Throwable) {
                          runOnUiThread {
                              saveStatus.text = "Gagal: ${e.message ?: e.javaClass.simpleName}"
                              setEnabled(saveBtn, true)
                          }
                      }
                  }
              }

              // ---------- Helper UI ----------
              private fun pick() {
                  picker.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly))
              }

              private fun setEnabled(b: Button, on: Boolean) {
                  b.isEnabled = on
                  b.alpha = if (on) 1f else 0.4f
              }

              private fun skin(b: Button, on: Boolean) {
                  b.background = GradientDrawable().apply {
                      cornerRadius = dp(14).toFloat()
                      setColor(if (on) BLUE else SOFT)
                  }
                  b.setTextColor(if (on) Color.WHITE else NAVY)
              }

              private fun action(t: String, primary: Boolean, onClick: () -> Unit): Button =
                  Button(this).apply {
                      text = t
                      isAllCaps = false
                      textSize = 15f
                      stateListAnimator = null
                      setPadding(dp(4), 0, dp(4), 0)
                      skin(this, primary)
                      setOnClickListener { onClick() }
                  }

              private fun paintSeg() {
                  skin(segH, horizontal)
                  skin(segV, !horizontal)
              }

              private fun paintColors() {
                  colorViews.forEachIndexed { i, v ->
                      val sel = colorValues[i] == bg
                      v.background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(colorValues[i])
                          setStroke(if (sel) dp(3) else dp(1), if (sel) BLUE else 0xFF999999.toInt())
                      }
                  }
              }

              private fun seekRow(label: String, onChange: (Int) -> Unit): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(2), 0, dp(2))
                  }
                  row.addView(TextView(this).apply { text = label; textSize = 15f },
                      LinearLayout.LayoutParams(dp(72), WRAP))
                  val value = TextView(this).apply {
                      text = "0"; gravity = Gravity.END; textSize = 14f; setTextColor(Color.GRAY)
                  }
                  val sb = SeekBar(this).apply {
                      max = 100
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              value.text = "$p"
                              onChange(p)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  row.addView(sb, LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.addView(value, LinearLayout.LayoutParams(dp(36), WRAP))
                  return row
              }

              private fun refresh() {
                  empty.visibility = if (uris.isEmpty()) View.VISIBLE else View.GONE
                  countText.text = if (uris.isEmpty()) "" else "${uris.size} gambar"
                  setEnabled(previewBtn, uris.size >= 2)
              }

              // ---------- Daftar gambar ----------
              private inner class Adapter : RecyclerView.Adapter<VH>() {
                  override fun getItemCount() = uris.size

                  override fun onCreateViewHolder(p: ViewGroup, t: Int): VH {
                      val row = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setBackgroundColor(Color.WHITE)
                          setPadding(dp(8), dp(4), dp(8), dp(4))
                          layoutParams = RecyclerView.LayoutParams(MATCH, WRAP).apply { bottomMargin = dp(3) }
                      }
                      val num = TextView(this@MainActivity).apply { textSize = 16f; gravity = Gravity.CENTER }
                      val img = ImageView(this@MainActivity).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                      val del = TextView(this@MainActivity).apply {
                          text = "✕"; textSize = 20f; setPadding(dp(20), dp(12), dp(12), dp(12))
                      }
                      row.addView(num, LinearLayout.LayoutParams(dp(32), WRAP))
                      row.addView(img, LinearLayout.LayoutParams(dp(64), dp(64)))
                      row.addView(View(this@MainActivity), LinearLayout.LayoutParams(0, 1, 1f))
                      row.addView(del)
                      val h = VH(row, img, num, del)
                      del.setOnClickListener {
                          val pos = h.bindingAdapterPosition
                          if (pos >= 0) {
                              uris.removeAt(pos)
                              notifyItemRemoved(pos)
                              notifyItemRangeChanged(pos, uris.size - pos)
                              refresh()
                          }
                      }
                      return h
                  }

                  override fun onBindViewHolder(h: VH, pos: Int) {
                      val u = uris[pos]
                      h.num.text = "${pos + 1}"
                      h.img.tag = u
                      val c = thumbs.get(u)
                      if (c != null) {
                          h.img.setImageBitmap(c)
                      } else {
                          h.img.setImageDrawable(null)
                          thumbPool.execute {
                              val b = try { decodeThumb(u) } catch (e: Throwable) { null }
                              if (b != null) {
                                  thumbs.put(u, b)
                                  runOnUiThread { if (h.img.tag == u) h.img.setImageBitmap(b) }
                              }
                          }
                      }
                  }
              }

              // ---------- Decode ----------
              private fun info(u: Uri): Info {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  contentResolver.openInputStream(u)!!.use { BitmapFactory.decodeStream(it, null, o) }
                  val rot = contentResolver.openInputStream(u)!!.use {
                      when (ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1)) {
                          6 -> 90; 3 -> 180; 8 -> 270; else -> 0
                      }
                  }
                  return if (rot == 90 || rot == 270) Info(u, o.outHeight, o.outWidth, rot)
                  else Info(u, o.outWidth, o.outHeight, rot)
              }

              /** Decode hemat memori: hanya sebesar yang dibutuhkan (targetW = lebar tampilan akhir). */
              private fun decode(i: Info, targetW: Int): Bitmap {
                  var s = 1
                  while (i.w / (s * 2) >= targetW) s *= 2
                  val o = BitmapFactory.Options().apply { inSampleSize = s }
                  var b = contentResolver.openInputStream(i.uri)!!.use { BitmapFactory.decodeStream(it, null, o) }!!
                  if (i.rot != 0) {
                      val m = Matrix().apply { postRotate(i.rot.toFloat()) }
                      val r = Bitmap.createBitmap(b, 0, 0, b.width, b.height, m, true)
                      b.recycle()
                      b = r
                  }
                  return b
              }

              private fun decodeThumb(u: Uri): Bitmap {
                  val i = info(u)
                  val tw = if (i.w >= i.h) 192 else max(1, 192 * i.w / i.h)
                  return decode(i, tw)
              }

              // ---------- Gabung ----------
              private class Layout(val rects: List<RectF>, val w: Int, val h: Int)

              private fun layout(infos: List<Info>, base: Float): Layout {
                  val unit = base / 1000f
                  val f = frameP * unit
                  val g = gapP * unit
                  val rects = ArrayList<RectF>(infos.size)
                  var pos = f
                  for (i in infos) {
                      if (horizontal) {
                          val w = i.w * base / i.h
                          rects.add(RectF(pos, f, pos + w, f + base)); pos += w + g
                      } else {
                          val h = i.h * base / i.w
                          rects.add(RectF(f, pos, f + base, pos + h)); pos += h + g
                      }
                  }
                  val total = pos - g + f
                  val ow = if (horizontal) total else base + 2 * f
                  val oh = if (horizontal) base + 2 * f else total
                  return Layout(rects, ceil(ow).toInt(), ceil(oh).toInt())
              }

              private fun mergeBitmap(
                  maxBase: Float = MAX_BASE,
                  maxPixels: Long = MAX_PIXELS,
                  maxSide: Int = MAX_SIDE
              ): Bitmap {
                  val infos = uris.toList().map { u -> pool.submit<Info> { info(u) } }.map { it.get() }
                  var base = min(
                      if (horizontal) infos.maxOf { it.h }.toFloat() else infos.maxOf { it.w }.toFloat(),
                      maxBase
                  )
                  var L = layout(infos, base)
                  while (L.w.toLong() * L.h > maxPixels || max(L.w, L.h) > maxSide) {
                      base *= 0.9f
                      L = layout(infos, base)
                  }

                  val out = Bitmap.createBitmap(L.w, L.h, Bitmap.Config.ARGB_8888)
                  val cv = Canvas(out)
                  cv.drawColor(bg)
                  val plain = Paint(Paint.FILTER_BITMAP_FLAG)
                  val round = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  val radius = radP * base / 1000f

                  var idx = 0
                  while (idx < infos.size) {
                      val end = min(idx + cores, infos.size)
                      // decode paralel per batch, gambar berurutan
                      val futs = (idx until end).map { j ->
                          pool.submit<Bitmap> { decode(infos[j], ceil(L.rects[j].width()).toInt()) }
                      }
                      futs.forEachIndexed { n, fu ->
                          val b = fu.get()
                          val r = L.rects[idx + n]
                          if (radius > 0f) {
                              val sh = BitmapShader(b, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP)
                              val m = Matrix()
                              m.setRectToRect(
                                  RectF(0f, 0f, b.width.toFloat(), b.height.toFloat()), r, Matrix.ScaleToFit.FILL
                              )
                              sh.setLocalMatrix(m)
                              round.shader = sh
                              cv.drawRoundRect(r, radius, radius, round)
                          } else {
                              cv.drawBitmap(b, null, r, plain)
                          }
                          b.recycle()
                      }
                      idx = end
                  }
                  return out
              }

              private fun saveBitmap(bm: Bitmap): Uri? {
                  val v = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "Kacampo_${System.currentTimeMillis()}.jpg")
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/KacampoFoto")
                      put(MediaStore.Images.Media.IS_PENDING, 1)
                  }
                  val u = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return null
                  contentResolver.openOutputStream(u)!!.use { bm.compress(Bitmap.CompressFormat.JPEG, 95, it) }
                  v.clear()
                  v.put(MediaStore.Images.Media.IS_PENDING, 0)
                  contentResolver.update(u, v, null, null)
                  return u
              }
          }
          EOF_5
      - name: Pakai MainActivity.kt dari repo jika ada
        run: |
          if [ -f MainActivity.kt ]; then
            cp MainActivity.kt app/src/main/java/com/fastmerge/MainActivity.kt
            echo "Memakai MainActivity.kt dari repo"
          fi
      - name: Siapkan kunci tanda tangan
        run: echo "" | base64 -d > fm.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KacampoFoto-apk
          path: app/build/outputs/apk/release/*.apk
