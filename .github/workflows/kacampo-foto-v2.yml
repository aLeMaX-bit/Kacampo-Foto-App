name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Buat proyek
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KacampoFoto"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fastmerge"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kacampo.foto"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }

              signingConfigs {
                  create("fm") {
                      storeFile = file("../fm.keystore")
                      storePassword = "fastmerge"
                      keyAlias = "fm"
                      keyPassword = "fastmerge"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                      // kunci tetap, supaya update APK bisa dipasang di atas versi lama
                      signingConfig = signingConfigs.getByName("fm")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.exifinterface:exifinterface:1.3.7")
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Sengaja TANPA permission INTERNET: aplikasi 100% offline dan tanpa iklan -->
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Kacampo Foto"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#141D2B</color>
          </resources>
          EOF_5
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_6
          mkdir -p app/src/main/res/drawable-nodpi
          echo "" | base64 -d > app/src/main/res/drawable-nodpi/ic_launcher_foreground.jpg
          mkdir -p app/src/main/res/drawable-nodpi
          echo "" | base64 -d > app/src/main/res/drawable-nodpi/logo_header.jpg
          mkdir -p app/src/main/assets
          echo "" | base64 -d > app/src/main/assets/montserrat_bold.ttf
          mkdir -p app/src/main/assets
          echo "" | base64 -d > app/src/main/assets/montserrat_medium.ttf
          mkdir -p app/src/main/java/com/fastmerge
          cat > app/src/main/java/com/fastmerge/MainActivity.kt <<'EOF_11'
          package com.fastmerge

          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.animation.AccelerateInterpolator
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.PickVisualMediaRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.exifinterface.media.ExifInterface
          import androidx.recyclerview.widget.ItemTouchHelper
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.util.concurrent.Executors
          import kotlin.math.ceil
          import kotlin.math.max
          import kotlin.math.min

          private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          private const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
          private const val MAX_PIXELS = 36_000_000L   // batas aman memori (hasil akhir)
          private const val MAX_SIDE = 16000
          private const val MAX_BASE = 2000f           // lebar/tinggi dasar maksimal hasil akhir
          private const val PREVIEW_PIXELS = 6_000_000L
          private const val PREVIEW_SIDE = 4096
          private const val BLUE = 0xFF2962FF.toInt()
          private const val NAVY = 0xFF1F3A93.toInt()
          private const val SOFT = 0xFFE3E8F7.toInt()

          class MainActivity : ComponentActivity() {

              private class Info(val uri: Uri, val w: Int, val h: Int, val rot: Int)
              private class Cfg(val horizontal: Boolean, val frame: Int, val gap: Int, val rad: Int, val bg: Int)
              private class Layout(val rects: List<RectF>, val w: Int, val h: Int)
              private class VH(val row: LinearLayout, val img: ImageView, val num: TextView, val del: TextView) :
                  RecyclerView.ViewHolder(row)

              private val uris = ArrayList<Uri>()
              private val thumbs = android.util.LruCache<Uri, Bitmap>(80)
              private val cores = Runtime.getRuntime().availableProcessors().coerceIn(2, 4)
              private val pool = Executors.newFixedThreadPool(cores)
              private val thumbPool = Executors.newFixedThreadPool(2)
              private val work = Executors.newSingleThreadExecutor()
              private val renderExec = Executors.newSingleThreadExecutor()

              // Pengaturan (default: horizontal). Diubah lewat halaman pratinjau.
              private var horizontal = true
              private var bg = Color.WHITE
              private var frameP = 0
              private var gapP = 0
              private var radP = 0

              private var lastSaved: Uri? = null
              private var previewToken = 0
              @Volatile private var renderGen = 0
              private var pInfos: List<Info>? = null
              private var pBitmaps: List<Bitmap>? = null
              private var pBase = 720f

              private val colorValues = intArrayOf(
                  Color.WHITE, Color.BLACK, 0xFF2962FF.toInt(),
                  0xFFE53935.toInt(), 0xFF43A047.toInt(), 0xFFFFB300.toInt()
              )
              private val colorViews = ArrayList<View>()

              private lateinit var mainView: View
              private lateinit var mainPanel: View
              private lateinit var previewView: View
              private lateinit var list: RecyclerView
              private lateinit var empty: TextView
              private lateinit var countText: TextView
              private lateinit var previewBtn: Button
              private lateinit var segH: Button
              private lateinit var segV: Button
              private lateinit var previewImg: ImageView
              private lateinit var previewMsg: TextView
              private lateinit var saveBtn: Button
              private lateinit var saveStatus: TextView
              private lateinit var backCb: OnBackPressedCallback

              private val picker =
                  registerForActivityResult(ActivityResultContracts.PickMultipleVisualMedia()) { r ->
                      if (r.isNotEmpty()) {
                          val start = uris.size
                          uris.addAll(r)
                          list.adapter?.notifyItemRangeInserted(start, r.size)
                          refresh()
                      }
                  }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun font(name: String, fallback: Typeface): Typeface =
                  try { Typeface.createFromAsset(assets, name) } catch (e: Throwable) { fallback }
              private fun cfg() = Cfg(horizontal, frameP, gapP, radP, bg)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val container = FrameLayout(this)
                  mainView = buildMain()
                  previewView = buildPreview()
                  previewView.visibility = View.GONE
                  container.addView(mainView, MATCH, MATCH)
                  container.addView(previewView, MATCH, MATCH)
                  setContentView(container)

                  backCb = object : OnBackPressedCallback(false) {
                      override fun handleOnBackPressed() { closePreview() }
                  }
                  onBackPressedDispatcher.addCallback(this, backCb)

                  paintSeg()
                  paintColors()
                  refresh()

                  // Animasi masuk panel bawah
                  mainPanel.translationY = dp(140).toFloat()
                  mainPanel.alpha = 0f
                  mainPanel.animate().translationY(0f).alpha(1f).setDuration(420)
                      .setInterpolator(DecelerateInterpolator(1.6f)).start()
              }

              // ---------- Efek animasi ----------
              private fun pressFx(v: View) {
                  v.setOnTouchListener { view, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN ->
                              view.animate().scaleX(0.94f).scaleY(0.94f).setDuration(90).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                              view.animate().scaleX(1f).scaleY(1f).setDuration(180)
                                  .setInterpolator(OvershootInterpolator(2.5f)).start()
                      }
                      false
                  }
              }

              private fun pulse(v: View) {
                  v.scaleX = 0.7f
                  v.scaleY = 0.7f
                  v.animate().scaleX(1f).scaleY(1f).setDuration(280)
                      .setInterpolator(OvershootInterpolator(3f)).start()
              }

              // ---------- Beranda: daftar gambar + tombol di bawah (zona jempol) ----------
              private fun buildMain(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F1F3F8"))
                  }

                  // Header: logo + nama (font Montserrat seperti di logo), "by aLeMaX" di bawahnya
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(22), dp(20), dp(10))
                  }
                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val logo = ImageView(this).apply {
                      setImageResource(R.drawable.logo_header)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, dp(12).toFloat())
                          }
                      }
                      clipToOutline = true
                  }
                  top.addView(logo, LinearLayout.LayoutParams(dp(52), dp(52)))
                  top.addView(TextView(this).apply {
                      text = "Kacampo Foto"
                      textSize = 24f
                      typeface = font("montserrat_bold.ttf", Typeface.DEFAULT_BOLD)
                      setTextColor(0xFF141D2B.toInt())
                      setPadding(dp(12), 0, 0, 0)
                  }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  countText = TextView(this).apply { textSize = 14f; setTextColor(Color.GRAY) }
                  top.addView(countText)
                  header.addView(top)
                  header.addView(TextView(this).apply {
                      text = "by aLeMaX"
                      textSize = 12f
                      typeface = font("montserrat_medium.ttf", Typeface.DEFAULT)
                      setTextColor(0xFF6B7A99.toInt())
                      setPadding(dp(2), dp(6), 0, 0)
                  })
                  root.addView(header)

                  val frame = FrameLayout(this)
                  list = RecyclerView(this).apply {
                      layoutManager = LinearLayoutManager(this@MainActivity)
                      adapter = Adapter()
                      setHasFixedSize(true)
                      clipToPadding = false
                      setPadding(dp(12), 0, dp(12), dp(8))
                  }
                  empty = TextView(this).apply {
                      text = "＋\n\nKetuk di sini untuk tambah gambar\n\nTahan lama lalu geser\nuntuk atur urutan"
                      gravity = Gravity.CENTER
                      textSize = 16f
                      setTextColor(Color.GRAY)
                      setOnClickListener { pick() }
                  }
                  frame.addView(list, MATCH, MATCH)
                  frame.addView(empty, MATCH, MATCH)
                  root.addView(frame, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  ItemTouchHelper(object : ItemTouchHelper.SimpleCallback(
                      ItemTouchHelper.UP or ItemTouchHelper.DOWN, 0
                  ) {
                      override fun onMove(
                          rv: RecyclerView, a: RecyclerView.ViewHolder, b: RecyclerView.ViewHolder
                      ): Boolean {
                          val f = a.bindingAdapterPosition
                          val t = b.bindingAdapterPosition
                          if (f < 0 || t < 0) return false
                          uris.add(t, uris.removeAt(f))
                          rv.adapter?.notifyItemMoved(f, t)
                          return true
                      }

                      override fun onSwiped(vh: RecyclerView.ViewHolder, d: Int) {}

                      override fun clearView(rv: RecyclerView, vh: RecyclerView.ViewHolder) {
                          super.clearView(rv, vh)
                          rv.post { rv.adapter?.notifyDataSetChanged() }
                      }
                  }).attachToRecyclerView(list)

                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(20))
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          val r = dp(24).toFloat()
                          cornerRadii = floatArrayOf(r, r, r, r, 0f, 0f, 0f, 0f)
                      }
                      elevation = dp(8).toFloat()
                  }
                  mainPanel = panel

                  val actions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val addBtn = action("+ Tambah", false) { pick() }
                  val clearBtn = action("Bersihkan", false) {
                      val n = uris.size
                      uris.clear()
                      list.adapter?.notifyItemRangeRemoved(0, n)
                      refresh()
                  }
                  previewBtn = action("Pratinjau ▶", true) { showPreview() }
                  actions.addView(addBtn, LinearLayout.LayoutParams(0, dp(60), 1f).apply { rightMargin = dp(8) })
                  actions.addView(clearBtn, LinearLayout.LayoutParams(0, dp(60), 1f).apply { rightMargin = dp(8) })
                  actions.addView(previewBtn, LinearLayout.LayoutParams(0, dp(60), 1.5f))
                  panel.addView(actions)

                  root.addView(panel, LinearLayout.LayoutParams(MATCH, WRAP))
                  return root
              }

              // ---------- Pratinjau: semua pengaturan berubah langsung (real-time) ----------
              private fun buildPreview(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF101218.toInt())
                  }
                  root.addView(TextView(this).apply {
                      text = "Pratinjau"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setPadding(dp(20), dp(24), dp(20), dp(2))
                  })
                  root.addView(TextView(this).apply {
                      text = "Ubah pengaturan di bawah, hasil langsung berubah"
                      textSize = 12f
                      setTextColor(Color.GRAY)
                      setPadding(dp(20), 0, dp(20), dp(4))
                  })

                  val fr = FrameLayout(this)
                  previewImg = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }
                  previewMsg = TextView(this).apply {
                      text = "Membuat pratinjau…"
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                  }
                  fr.addView(previewImg, MATCH, MATCH)
                  fr.addView(previewMsg, MATCH, MATCH)
                  root.addView(fr, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  saveStatus = TextView(this).apply {
                      gravity = Gravity.CENTER
                      textSize = 13f
                      setTextColor(Color.LTGRAY)
                      setPadding(dp(16), dp(4), dp(16), dp(6))
                      setOnClickListener {
                          lastSaved?.let {
                              startActivity(Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(it, "image/jpeg")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              })
                          }
                      }
                  }
                  root.addView(saveStatus)

                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(14), dp(16), dp(1
